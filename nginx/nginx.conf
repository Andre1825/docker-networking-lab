# Full configuration mounted read-only at /etc/nginx/nginx.conf.
# Compose runs Nginx as UID 101; writable runtime files belong in /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 1m;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    # Nginx initializes these module paths even when they are not used here.
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format lab '$remote_addr "$request" status=$status '
                   'upstream=$upstream_addr upstream_status=$upstream_status '
                   'request_time=$request_time';
    access_log /dev/stdout lab;

    # Docker's embedded DNS tracks replicas without fixed container IPs.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream flask_app {
        zone flask_app 64k;
        # All IPs returned for app become equal-weight round-robin backends.
        # Dynamic upstream resolution requires Nginx OSS >= 1.27.3.
        server app:5000 resolve max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Local proxy liveness, independent of Flask or database readiness.
        location = /nginx-health {
            access_log off;
            return 204;
        }

        location / {
            proxy_pass http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502 http_504;
            proxy_next_upstream_tries 3;

            # Educational only: show the selected replica in curl/browser tools.
            add_header X-Lab-Upstream $upstream_addr always;
        }
    }
}
